name: keepalive

# A daily request to the Supabase project, so the free project is never paused after 7 days
# without use (decision of the PO, E2-1). It calls the database function `ping`, which answers
# `true` without sign-in and without any data. Only public values: the repository variables
# VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables →
# Actions → Variables). GitHub switches scheduled workflows off after 60 days without activity in
# the repository and says so by e-mail; then switch it on again under Actions → keepalive.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase wach halten
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Repository-Variablen VITE_SUPABASE_URL und VITE_SUPABASE_PUBLISHABLE_KEY fehlen; kein Abruf."
            exit 0
          fi
          answer=$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Antwort von Supabase: $answer"
          test "$answer" = "true"
