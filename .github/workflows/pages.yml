name: pages

# Publishes the app on GitHub Pages, but only after the workflow "check" has passed on main.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A manual start (workflow_dispatch) deploys whatever is on main without a check run. After a
    # check run only a push to this repository counts: `branches: [main]` above matches the branch
    # name alone, so a pull request from a fork's own "main" would pass it too (K2a).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit that passed the check, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Shown under "Einstellungen → Version", so an installed app tells which build it runs.
          APP_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Shared storage with sign-in (E2-3f). Way back: repository variable VITE_BACKEND=local
          # (Settings → Secrets and variables → Actions → Variables), then run this workflow again.
          VITE_BACKEND: ${{ vars.VITE_BACKEND || 'supabase' }}
          # Public values of the Supabase project (repository variables, not secrets).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Public VAPID key of the notifications (NT-a); without it the tile says "nicht eingerichtet".
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
