name: pages

# Publishes the app on GitHub Pages, but only after the workflow "check" has passed on main.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A manual start (workflow_dispatch) deploys whatever is on main without a check run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that passed the check, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Shown under "Einstellungen → Version", so an installed app tells which build it runs.
          APP_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Shared storage with sign-in (E2-3f). Way back: repository variable VITE_BACKEND=local
          # (Settings → Secrets and variables → Actions → Variables), then run this workflow again.
          VITE_BACKEND: ${{ vars.VITE_BACKEND || 'supabase' }}
          # Public values of the Supabase project (repository variables, not secrets).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
