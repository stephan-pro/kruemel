name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Database rules and functions against a local Supabase instance (Docker is there on the runner;
  # no secrets needed). "pages" publishes only when this workflow, i.e. both jobs, passed.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:db
      - if: failure()
        name: Protokolle der lokalen Instanz (Echtzeit, Datenbank)
        run: |
          docker logs supabase_realtime_kruemel --tail 80 2>&1 || true
          docker logs supabase_db_kruemel --tail 40 2>&1 || true
