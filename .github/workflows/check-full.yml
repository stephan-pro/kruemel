name: check-full

# The full test matrix (`npm run check:full`: Chromium and WebKit, desktop and phone) nightly and by
# hand, e.g. before a release, plus the security check of the dependencies (scripts/audit.mjs).
# Every push runs the faster workflow "check". A separate workflow, so
# that "pages" (which waits for "check") does not publish again after each nightly run.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known vulnerabilities (WT-a): production dependencies high/critical fail the run, unless
      # listed with reason and expiry in scripts/audit-exceptions.json; development tools only warn.
      - run: node scripts/audit.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check:full
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
