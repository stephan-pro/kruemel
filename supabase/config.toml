# The local Supabase instance of `npm run check:db` (CI only, job `db`). Only what the app uses is
# switched on: database, API, sign-in, realtime and the mail catcher (Mailpit) for the codes.
# The real project in Paris (eu-west-3) is set up by hand in the dashboard (see docs/SUPABASE.md); the
# values that matter there (code instead of link, 10 minutes, addresses) are the same as here.
project_id = "kruemel"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

# Catches the mails with the codes (Mailpit); `supabase/tests/auth.test.ts` reads them there.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[edge_runtime]
enabled = false

# The Edge Function of the notifications (NT-a) checks the sign-in itself (Supabase advises that
# with the new API keys); deployed by hand with `npx supabase functions deploy push`.
[functions.push]
verify_jwt = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "https://stephan-pro.github.io/kruemel/"
additional_redirect_urls = ["http://localhost:5173/kruemel/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
# Higher than in the real project, so a test run is not throttled.
email_sent = 100
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
# Sign-in with a six-digit code, valid for 10 minutes (E2-1).
otp_length = 6
otp_expiry = 600

# The same texts as in the dashboard of the real project: the code, no link. A new person gets
# the "confirmation" mail, a known one the "magic link" mail; both carry the code.
[auth.email.template.confirmation]
subject = "Dein Anmeldecode für Krümel / Your sign-in code for Krümel"
content_path = "./supabase/templates/code.html"

[auth.email.template.magic_link]
subject = "Dein Anmeldecode für Krümel / Your sign-in code for Krümel"
content_path = "./supabase/templates/code.html"

# New accounts only with an invite (E2-5b): the function of the migration `…_friend_invites.sql`
# decides before an account is made and a mail goes out. In the real project the same hook is
# switched on in the dashboard (Authentication → Auth Hooks, see docs/SUPABASE.md).
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
